[project]
name = "savepoint"
version = "0.1.0"
description = "Checkpoint, verify and roll back AI agents working on legacy GUI applications"
readme = "README.md"
authors = [
    { name = "Srihari Venkatesan", email = "ksvhari007@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.13.0",
    "fastapi>=0.143.0",
    "flask>=3.1.3",
    "opentelemetry-sdk>=1.45.1",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "pymysql>=1.2.3",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "faker>=40.43.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
ignore = ["ISC004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
"scripts/**" = ["B023"]
