id: openmrs.capture_vitals
app: openmrs
title: Capture vital signs
fixture: seed_a
lookup_only: false
params:
  patient_id: 9
  height: 170
  weight: 62
instruction: Open the dashboard of patient {patient_id}, capture vitals with height {height} cm and weight {weight} kg, and save. Report done.
invariants:
- id: identifiers_unique
  expect:
    equals: 0
  sql: SELECT count(*) FROM (SELECT identifier FROM patient_identifier WHERE voided = 0 GROUP BY identifier HAVING count(*) > 1) d
- id: no_orphan_names
  expect:
    equals: 0
  sql: SELECT count(*) FROM person_name n LEFT JOIN person p ON p.person_id = n.person_id WHERE p.person_id IS NULL
goal:
- id: weight_recorded
  expect:
    equals: 1
  sql: SELECT count(*) FROM obs WHERE person_id = :patient_id AND concept_id = 5089 AND value_numeric = :weight AND voided = 0
- id: height_recorded
  expect:
    equals: 1
  sql: SELECT count(*) FROM obs WHERE person_id = :patient_id AND concept_id = 5090 AND value_numeric = :height AND voided = 0
frame:
  unchanged:
  - person
  - person_name
  - person_address
  - person_attribute
  - patient
  - patient_identifier
  - visit
  - encounter
  - obs
  - allergy
  - allergy_reaction
  - relationship
  allowed:
  - table: encounter
    insert: 1
  - table: obs
    insert: 9
