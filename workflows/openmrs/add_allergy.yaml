id: openmrs.add_allergy
app: openmrs
title: Record an allergy
fixture: seed_a
lookup_only: false
params:
  patient_id: 7
  allergen: 162298
  severity: 1498
instruction: Open the allergies page of patient {patient_id}, record allergen concept {allergen} with severity {severity} and save. Report done.
invariants:
- id: identifiers_unique
  expect:
    equals: 0
  sql: SELECT count(*) FROM (SELECT identifier FROM patient_identifier WHERE voided = 0 GROUP BY identifier HAVING count(*) > 1) d
- id: no_orphan_names
  expect:
    equals: 0
  sql: SELECT count(*) FROM person_name n LEFT JOIN person p ON p.person_id = n.person_id WHERE p.person_id IS NULL
goal:
- id: allergy_recorded
  expect:
    equals: 1
  sql: SELECT count(*) FROM allergy WHERE patient_id = :patient_id AND coded_allergen = :allergen AND voided = 0
frame:
  unchanged:
  - person
  - person_name
  - person_address
  - person_attribute
  - patient
  - patient_identifier
  - visit
  - encounter
  - obs
  - allergy
  - allergy_reaction
  - relationship
  allowed:
  - table: allergy
    insert: 1
  - table: allergy_reaction
    insert: 3
  - table: patient
    where: patient_id = :patient_id
    columns:
    - allergy_status
    - changed_by
