id: openmrs.onboard_patient
app: openmrs
title: Register a new patient
fixture: seed_a
lookup_only: false
params:
  given: Neha
  family: Kulkarni
instruction: Register a new patient named {given} {family}, female, born 12 April 1990, living at 12 Test Street, Pune. Do not start a visit. Report done.
invariants:
- id: identifiers_unique
  expect:
    equals: 0
  sql: SELECT count(*) FROM (SELECT identifier FROM patient_identifier WHERE voided = 0 GROUP BY identifier HAVING count(*) > 1) d
- id: no_orphan_names
  expect:
    equals: 0
  sql: SELECT count(*) FROM person_name n LEFT JOIN person p ON p.person_id = n.person_id WHERE p.person_id IS NULL
goal:
- id: patient_registered
  expect:
    equals: 1
  sql: SELECT count(*) FROM person_name n JOIN patient p ON p.patient_id = n.person_id WHERE n.given_name = :given AND n.family_name = :family AND n.voided = 0
frame:
  unchanged:
  - person
  - person_name
  - person_address
  - person_attribute
  - patient
  - patient_identifier
  - visit
  - encounter
  - obs
  - allergy
  - allergy_reaction
  - relationship
  allowed:
  - table: person
    insert: 1
  - table: person_name
    insert: 1
  - table: person_address
    insert: 1
  - table: patient
    insert: 1
  - table: patient_identifier
    insert: 1
