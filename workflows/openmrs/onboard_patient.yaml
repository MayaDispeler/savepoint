# DRAFT, not executed (needs the OpenMRS sandbox). Table and column names follow the OpenMRS 2.x schema and are unverified.
id: openmrs.onboard_patient
app: openmrs
title: Register a new patient
fixture: seed_a
params: { given: "Asha", family: "Rao", gender: "F", birthdate: "1990-04-12", identifier: "TEST-0001" }
instruction: >
  Register a new patient named {given} {family}, gender {gender}, born {birthdate}, with identifier {identifier}.
  Do not start a visit. Report done.
invariants:
  - id: no_voided_new_persons
    sql: SELECT count(*) FROM person WHERE voided = 1 AND date_created > '2026-01-01'
    expect: { equals: 0 }
goal:
  - id: patient_exists
    sql: SELECT count(*) FROM patient_identifier WHERE identifier = :identifier AND voided = 0
    expect: { equals: 1 }
  - id: name_set
    sql: SELECT count(*) FROM person_name WHERE given_name = :given AND family_name = :family AND voided = 0
    expect: { equals: 1 }
frame:
  unchanged: [person, person_name, patient, patient_identifier, visit]
  allowed:
    - { table: person, insert: 1 }
    - { table: person_name, insert: 1 }
    - { table: patient, insert: 1 }
    - { table: patient_identifier, insert: 1 }
