id: openmrs.end_visit
app: openmrs
title: End the active visit
fixture: seed_a
lookup_only: false
params:
  patient_id: 9
instruction: Open the dashboard of patient {patient_id}, end the active visit and confirm. Report done.
invariants:
- id: identifiers_unique
  expect:
    equals: 0
  sql: SELECT count(*) FROM (SELECT identifier FROM patient_identifier WHERE voided = 0 GROUP BY identifier HAVING count(*) > 1) d
- id: no_orphan_names
  expect:
    equals: 0
  sql: SELECT count(*) FROM person_name n LEFT JOIN person p ON p.person_id = n.person_id WHERE p.person_id IS NULL
goal:
- id: no_open_visit
  expect:
    equals: 0
  sql: SELECT count(*) FROM visit WHERE patient_id = :patient_id AND date_stopped IS NULL AND voided = 0
frame:
  unchanged:
  - person
  - person_name
  - person_address
  - person_attribute
  - patient
  - patient_identifier
  - visit
  - encounter
  - obs
  - allergy
  - allergy_reaction
  - relationship
  allowed:
  - table: visit
    where: patient_id = :patient_id
    columns:
    - date_stopped
    - changed_by
    - date_changed
