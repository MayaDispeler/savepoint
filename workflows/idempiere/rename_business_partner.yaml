id: idempiere.rename_business_partner
app: idempiere
title: Rename a business partner
fixture: seed_a
lookup_only: false
params:
  value: JoeBlock
  name: Joe Block Jr.
instruction: Open the business partner with search key {value}, change its name to {name} and save. Report done.
invariants:
- id: no_duplicate_partner_keys
  expect:
    equals: 0
  sql: SELECT count(*) FROM (SELECT value FROM c_bpartner WHERE ad_client_id = 11 GROUP BY value HAVING count(*) > 1) d
- id: no_orphan_customer_accounts
  expect:
    equals: 0
  sql: SELECT count(*) FROM c_bp_customer_acct a LEFT JOIN c_bpartner b ON b.c_bpartner_id = a.c_bpartner_id WHERE b.c_bpartner_id IS NULL
goal:
- id: name_set
  expect:
    equals: Joe Block Jr.
  sql: SELECT name FROM c_bpartner WHERE value = :value
frame:
  unchanged:
  - c_bpartner
  - c_bp_customer_acct
  - c_bp_vendor_acct
  - c_bp_employee_acct
  - c_bpartner_location
  - ad_treenodebp
  - m_product
  - m_product_acct
  - ad_treenodepr
  allowed:
  - table: c_bpartner
    where: value = :value
    columns:
    - name
