id: idempiere.delete_business_partner
app: idempiere
title: Delete a test business partner
fixture: seed_a
lookup_only: false
params:
  value: BP-DELME
instruction: Open the business partner with search key {value}, delete the record and confirm. Report done.
invariants:
- id: no_duplicate_partner_keys
  expect:
    equals: 0
  sql: SELECT count(*) FROM (SELECT value FROM c_bpartner WHERE ad_client_id = 11 GROUP BY value HAVING count(*) > 1) d
- id: no_orphan_customer_accounts
  expect:
    equals: 0
  sql: SELECT count(*) FROM c_bp_customer_acct a LEFT JOIN c_bpartner b ON b.c_bpartner_id = a.c_bpartner_id WHERE b.c_bpartner_id IS NULL
goal:
- id: partner_gone
  expect:
    equals: 0
  sql: SELECT count(*) FROM c_bpartner WHERE value = :value
frame:
  unchanged:
  - c_bpartner
  - c_bp_customer_acct
  - c_bp_vendor_acct
  - c_bp_employee_acct
  - c_bpartner_location
  - ad_treenodebp
  - m_product
  - m_product_acct
  - ad_treenodepr
  allowed:
  - table: c_bpartner
    delete: 1
  - table: ad_treenodebp
    delete: 1
  - table: c_bp_customer_acct
    delete: 2
  - table: c_bp_vendor_acct
    delete: 2
