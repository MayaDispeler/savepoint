id: idempiere.lookup_product
app: idempiere
title: Look up a product (lookup only)
fixture: seed_a
lookup_only: true
params:
  value: Rose Bush
instruction: Open the product with search key {value}, read its name, change nothing and report done.
invariants:
- id: no_duplicate_partner_keys
  expect:
    equals: 0
  sql: SELECT count(*) FROM (SELECT value FROM c_bpartner WHERE ad_client_id = 11 GROUP BY value HAVING count(*) > 1) d
- id: no_orphan_customer_accounts
  expect:
    equals: 0
  sql: SELECT count(*) FROM c_bp_customer_acct a LEFT JOIN c_bpartner b ON b.c_bpartner_id = a.c_bpartner_id WHERE b.c_bpartner_id IS NULL
goal:
- id: product_present
  expect:
    equals: 1
  sql: SELECT count(*) FROM m_product WHERE value = :value AND ad_client_id = 11
frame:
  unchanged:
  - c_bpartner
  - c_bp_customer_acct
  - c_bp_vendor_acct
  - c_bp_employee_acct
  - c_bpartner_location
  - ad_treenodebp
  - m_product
  - m_product_acct
  - ad_treenodepr
  allowed: []
