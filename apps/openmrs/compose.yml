# OpenMRS Reference Application 2.12 (classic UI) + MySQL 5.7. Sandbox only: demo data, default credentials.
# Host networking: container-to-container bridge traffic is blocked in GitHub Codespaces.
services:
  db:
    image: mysql:5.7
    network_mode: host
    command: "mysqld --character-set-server=utf8 --collation-server=utf8_general_ci --max_allowed_packet=64M --bind-address=127.0.0.1"
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_ROOT_PASSWORD: openmrs
      MYSQL_USER: openmrs
      MYSQL_PASSWORD: openmrs
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-popenmrs"]
      interval: 10s
      timeout: 5s
      retries: 20
  openmrs:
    image: openmrs/openmrs-reference-application-distro:2.12.2
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DATABASE: openmrs
      DB_HOST: 127.0.0.1
      DB_USERNAME: openmrs
      DB_PASSWORD: openmrs
      DB_CREATE_TABLES: "true"
      DB_AUTO_UPDATE: "true"
      MODULE_WEB_ADMIN: "true"
