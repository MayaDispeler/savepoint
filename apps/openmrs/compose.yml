# OpenMRS Reference Application 2.12 (classic UI) + MySQL 5.7. Sandbox only: demo data, default credentials.
services:
  db:
    image: mysql:5.7
    command: "mysqld --character-set-server=utf8 --collation-server=utf8_general_ci --max_allowed_packet=64M"
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_ROOT_PASSWORD: openmrs
      MYSQL_USER: openmrs
      MYSQL_PASSWORD: openmrs
    ports: ["127.0.0.1:3307:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-popenmrs"]
      interval: 10s
      timeout: 5s
      retries: 20
  openmrs:
    image: openmrs/openmrs-reference-application-distro:2.12.2
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DATABASE: openmrs
      DB_HOST: db
      DB_USERNAME: openmrs
      DB_PASSWORD: openmrs
      DB_CREATE_TABLES: "true"
      DB_AUTO_UPDATE: "true"
      MODULE_WEB_ADMIN: "true"
    ports: ["127.0.0.1:8080:8080"]
