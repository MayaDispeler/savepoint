<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ClaimDesk 98</title>
<style>
body{background:#c0c0c0;font:12px Tahoma,Arial,sans-serif;color:#000;margin:0}
#bar{background:#000080;color:#fff;padding:3px 6px;font-weight:bold}
#nav{background:#d4d0c8;border-bottom:2px solid #808080;padding:4px 6px}
#nav a{margin-right:12px;color:#000080}
#main{padding:10px}
table{border-collapse:collapse;background:#fff}
th{background:#d4d0c8;border:2px outset #fff;padding:2px 6px;text-align:left}
td{border:1px solid #808080;padding:2px 6px}
input,select,textarea,button{font:12px Tahoma,Arial,sans-serif}
button,.btn{background:#d4d0c8;border:2px outset #fff;padding:2px 10px;cursor:pointer;color:#000;text-decoration:none}
.msg{background:#ffffe1;border:1px solid #000;padding:3px 6px;margin-bottom:8px}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35)}
#overlay .box{background:#d4d0c8;border:2px outset #fff;width:300px;margin:120px auto;padding:10px}
</style></head><body>
<div id="bar">ClaimDesk 98 - Claims Management</div>
{% if session.user %}<div id="nav"><a href="{{ url_for('claims') }}">Claims</a><a href="{{ url_for('payees') }}">Payees</a><span>User: {{ session.user }}</span></div>{% endif %}
<div id="main">
{% for m in get_flashed_messages() %}<div class="msg" role="status">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}
</div></body></html>
