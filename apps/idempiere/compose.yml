# iDempiere 13 + PostgreSQL, GardenWorld demo client. Sandbox only: default credentials.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
  idempiere:
    image: idempiereofficial/idempiere:13-release
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: idempiere
      DB_USER: adempiere
      DB_PASS: adempiere
      DB_ADMIN_PASS: postgres
      MIGRATE_EXISTING_DATABASE: "false"
    ports: ["127.0.0.1:8081:8080"]
