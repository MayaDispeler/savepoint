# iDempiere (image idempiereofficial/idempiere:13-release; its log reports 10.0.1) + PostgreSQL 16, GardenWorld demo client. Sandbox only: default credentials (GardenAdmin / GardenAdmin).
# Host networking: container-to-container bridge traffic is blocked in GitHub Codespaces. Stop OpenMRS first (port 8080).
services:
  postgres:
    image: postgres:16
    network_mode: host
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
  idempiere:
    image: idempiereofficial/idempiere:13-release
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: idempiere
      DB_USER: adempiere
      DB_PASS: adempiere
      DB_ADMIN_PASS: postgres
      MIGRATE_EXISTING_DATABASE: "false"
